[workspace]
resolver = "3"
members = ["core", "ffi", "awdl-helper", "desktop/platform", "desktop/app"]

[profile.release]
strip = true

# libc only exposes some XNU networking items for macOS; netdev and netwatch use them on
# iOS too. The copies in vendor/ are patched for iOS (marked "KVM patch"); drop them once fixed upstream.
[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }
