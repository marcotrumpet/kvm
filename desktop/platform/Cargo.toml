[package]
name = "kvm-platform"
version = "0.1.0"
edition = "2024"
description = "The OS layer of the Windows and Linux app: input capture and injection, tray, clipboard, updates."

[dependencies]
anyhow = "1.0.104"

[target.'cfg(windows)'.dependencies]
tracing = "0.1.44"
arboard = { version = "3.7", default-features = false }
libloading = "0.9"
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
tracing = "0.1.44"
openh264 = { version = "=0.9.9", optional = true } # H.264 for sharing the screen (Linux has no system encoder)
arboard = { version = "3.7", default-features = false }
ksni = { version = "0.3", features = ["blocking"] }
x11rb = { version = "0.13", features = ["randr", "xfixes", "xtest"] }

[features]
default = ["h264"]
# OpenH264 (C++) for Linux screen sharing. Off for checking Linux from another OS, which
# has no C++ compiler for it: cargo check --target x86_64-unknown-linux-gnu --no-default-features
h264 = ["dep:openh264"]

[dev-dependencies]
openh264 = "=0.9.9" # the software encoder's tests run anywhere
