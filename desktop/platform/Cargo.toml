[package]
name = "kvm-platform"
version = "0.1.0"
edition = "2024"
description = "The OS layer of the Windows and Linux app: input capture and injection, tray, clipboard, updates."

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.7", default-features = false }
libloading = "0.9"
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
