# Builds and tests the Windows and Linux app on every push that touches it (the Mac and iOS apps are
# built locally and by the release workflow).
name: CI

on:
  push:
    paths: ["core/**", "desktop/**", "Cargo.*", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["core/**", "desktop/**", "Cargo.*", ".github/workflows/ci.yml"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p kvm-platform -p kvm-desktop
      - run: cargo build -p kvm-desktop

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # FFmpeg's libavcodec, which the viewer loads: its decoding test then runs for real.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo test -p kvm-platform -p kvm-desktop
        env:
          KVM_REQUIRE_FFMPEG: "1"
      - run: cargo build -p kvm-desktop
