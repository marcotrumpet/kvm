# Builds, signs and publishes a Mac release that installed copies update to (Sparkle).
# Bump VERSION in macos/build.sh and push, then: Actions > Release > Run workflow, or
#   gh workflow run release.yml -f notes="one item per line"
#
# Secrets:
#   SPARKLE_PRIVATE_KEY          update signing key (generate_keys -x)
#   DEVELOPER_ID_P12             "Developer ID Application" certificate and key, .p12 in base64
#   DEVELOPER_ID_P12_PASSWORD    its export password
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes, one item per line (empty: commit subjects since the last release)"
        required: false
      publish:
        description: "Publish the GitHub release (off: build and sign only, kept as a workflow artifact)"
        type: boolean
        default: true
      trace:
        description: "Print each command the scripts run (to debug a failing release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the default notes

      - name: Toolchains
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -z "$P12" ]; then
            # Ad-hoc signed copies would lose their permissions and fail Sparkle's checks.
            [ "$PUBLISH" != true ] || { echo "::error::DEVELOPER_ID_P12 secret missing"; exit 1; }
            echo "::warning::No DEVELOPER_ID_P12: signing ad-hoc (test build only)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          PUBLISH: ${{ inputs.publish && '1' || '0' }}
          TRACE: ${{ inputs.trace && '1' || '0' }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret missing"; exit 1; }
          macos/release.sh "$NOTES"

      - name: Keep the build
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: KVM-macos
          path: |
            dist/KVM-macos.zip
            dist/appcast.xml
